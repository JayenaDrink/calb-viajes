<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viajes · Amistades Belgas de Levante</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#990000;--yellow:#ffcc00;--black:#141414;--bg:#fbf8f1;--muted:#6f655c;--line:#ece3d3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1f1a17;font:17px/1.6 Inter,system-ui,sans-serif}
header{background:var(--red);color:#fff;text-align:center;padding:48px 20px 56px;position:relative}
header img{width:170px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.35))}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2.2rem,6vw,3.4rem);margin:.4em 0 .1em}
header p{margin:0;color:var(--yellow);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem}
.stripe{position:absolute;left:0;right:0;bottom:0;height:8px;display:flex}.stripe i{flex:1}
main{max-width:760px;margin:0 auto;padding:40px 20px 60px}
a.trip{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:20px 24px;margin-bottom:14px;text-decoration:none;color:inherit;border-left:6px solid var(--yellow);box-shadow:0 8px 24px rgba(60,20,10,.08);transition:transform .2s}
a.trip:hover{transform:translateY(-3px)}
a.trip b{font-family:Fraunces,serif;font-size:1.4rem;display:block}
a.trip span{color:var(--muted)}
a.trip em{font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding-bottom:40px}
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="Logo de Las Amistades Belgas de Levante">
  <h1>Viajes de socios</h1>
  <p>Las Amistades Belgas de Levante · Calpe</p>
  <div class="stripe"><i style="background:#141414"></i><i style="background:#ffcc00"></i><i style="background:#990000"></i></div>
</header>
<main>
  <!-- Añadir aquí cada viaje nuevo, el más reciente primero -->
  <a class="trip" href="/madrid-2026"><div><b>Madrid en Navidad</b><span>23 – 25 de noviembre de 2026</span></div><em>Ver programa →</em></a>
</main>
<footer>A.S.B.L. · V.Z.W.</footer>
</body>
</html>
