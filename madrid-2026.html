<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viajes · Amistades Belgas de Levante</title>
<meta name="description" content="Programa de viaje de socios de Las Amistades Belgas de Levante, Calpe.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --red:#990000; --red-d:#6e0000; --yellow:#ffcc00; --black:#141414;
  --bg:#fbf8f1; --card:#fff; --ink:#1f1a17; --muted:#6f655c; --line:#ece3d3;
  --shadow:0 10px 30px rgba(60,20,10,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.12;margin:0}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* AVISO EJEMPLO */
.demo{background:var(--yellow);color:var(--black);text-align:center;font-weight:600;font-size:.9rem;padding:8px 16px}

/* HERO */
.hero{position:relative;background:var(--red);color:#fff;overflow:hidden}
.hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;mix-blend-mode:luminosity}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 85% 20%,rgba(255,204,0,.22),transparent 45%),
  linear-gradient(180deg,rgba(110,0,0,.2),rgba(60,0,0,.65))}
.hero .stripe{position:absolute;left:0;right:0;bottom:0;height:10px;display:flex}
.hero .stripe i{flex:1}
.hero .in{position:relative;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:56px 20px 70px;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.95}
.brand img{width:44px;height:44px}
.hero h1{font-size:clamp(2.6rem,7vw,4.8rem);font-weight:800;margin:.35em 0 .2em}
.hero .sub{font-family:Fraunces,serif;font-style:italic;font-size:1.3rem;color:var(--yellow)}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;font-weight:500}
.pill.y{background:var(--yellow);color:var(--black);border-color:var(--yellow);font-weight:700}
.logo-big{width:min(300px,30vw);filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}

/* SECTIONS */
section{padding:56px 0}
.head{margin-bottom:24px}
.head .k{color:var(--red);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem}
.head h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-top:.2em}

/* INFO CARDS */
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:-40px;position:relative;z-index:2}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);border-top:5px solid var(--yellow)}
.card .ic{font-size:1.7rem}
.card h3{font-size:1.15rem;margin:.35em 0 .25em}
.card p{margin:0;color:var(--muted)}
.card b{color:var(--ink)}
.card.red{border-top-color:var(--red)}
.card.blk{border-top-color:var(--black)}

/* TABS */
.tabs{display:flex;gap:10px;overflow-x:auto;position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0;margin-bottom:8px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 18px;cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.tab b{display:block;font-family:Fraunces,serif;font-size:1.1rem}
.tab span{font-size:.82rem;color:var(--muted)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.tab.on span{color:#ffe7a0}
.tab.all{border-style:dashed}

.day{display:none;animation:fade .4s ease}
.day.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.day-head{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:end;margin:18px 0 22px}
.day-head .n{color:var(--red);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem}
.day-head h3{font-size:2.1rem;margin:.15em 0}
.day-head p{color:var(--muted);margin:0}
.day-photo{border-radius:20px;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(135deg,var(--red),var(--red-d));position:relative}
.day-photo img{width:100%;height:100%;object-fit:cover}
.day-photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.day-photo .ph img{width:38%;height:auto;opacity:.9}

/* TIMELINE */
.tl{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:86px 54px 1fr;align-items:start;position:relative}
.act .h{font-family:Fraunces,serif;font-weight:700;font-size:1.35rem;padding-top:14px;text-align:right;padding-right:14px;color:var(--red)}
.act .dot{position:relative;display:flex;justify-content:center;height:100%}
.act .dot::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--line)}
.act:first-child .dot::before{top:30px}
.act:last-child .dot::before{bottom:calc(100% - 30px)}
.act .dot i{position:relative;margin-top:8px;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.2rem}
.act .body{background:#fff;border-radius:16px;padding:14px 18px;margin:6px 0 12px 8px;box-shadow:0 4px 14px rgba(60,20,10,.06);border:1px solid var(--line)}
.act .body b{font-size:1.08rem}
.act .body p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.act .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-bottom:4px;background:#f6efe2;color:var(--muted)}
.act.now .body{border:2px solid var(--red);box-shadow:0 6px 20px rgba(153,0,0,.18)}
.act.now .dot i{background:var(--red);border-color:var(--red)}
.act.now .tag{background:var(--red);color:#fff}
.act.past{opacity:.5}

/* STAY + LIST */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0 10px 34px;border-bottom:1px solid var(--line);position:relative}
.list li::before{content:"✓";position:absolute;left:4px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--black);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
#map{height:360px;border-radius:20px;box-shadow:var(--shadow);margin-top:18px;z-index:0}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;background:var(--red);color:#fff;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}

footer{background:var(--black);color:#cfc6bb;text-align:center;padding:40px 20px 50px;font-size:.88rem}
footer img{width:72px;margin:0 auto 12px}

@media (max-width:820px){
  .hero .in{grid-template-columns:1fr;padding-top:36px}
  .logo-big{width:150px;order:-1}
  .brand img{display:none}
  .info,.two{grid-template-columns:1fr}
  .day-head{grid-template-columns:1fr}
  .act{grid-template-columns:66px 48px 1fr}
  .act .h{font-size:1.1rem;padding-right:8px}
}

/* IMPRIMIR: todo el programa */
@media print{
  .demo,.tabs,.actions,#map,.logo-big,footer{display:none!important}
  body{background:#fff;font-size:12pt}
  .hero{background:#fff!important;color:#000}
  .hero::before,.hero .bgimg{display:none}
  .hero .sub{color:#990000}
  .pill{border-color:#999}
  .info{margin-top:0}
  .card,.act .body{box-shadow:none}
  .day{display:block!important;page-break-inside:avoid}
  .day-photo{display:none}
  section{padding:20px 0}
}
</style>
</head>
<body>

<div class="demo" id="demo" hidden>Plantilla de ejemplo · el programa definitivo se publicará aquí</div>

<header class="hero" id="hero">
  <div class="stripe"><i style="background:#141414"></i><i style="background:#ffcc00"></i><i style="background:#990000"></i></div>
  <div class="in">
    <div>
      <div class="brand"><img src="/logo-256.png" alt="">Amistades Belgas de Levante · Calpe</div>
      <h1 id="titulo"></h1>
      <div class="sub" id="subtitulo"></div>
      <div class="pills" id="pills"></div>
    </div>
    <img class="logo-big" src="/logo.png" alt="Logo de Las Amistades Belgas de Levante">
  </div>
</header>

<div class="wrap">
  <div class="info" id="info"></div>

  <section id="programa">
    <div class="head"><div class="k">Programa</div><h2>Día a día</h2></div>
    <div class="tabs" id="tabs"></div>
    <div id="dias"></div>
    <div class="actions">
      <button class="btn" onclick="window.print()">🖨️ Imprimir programa</button>
      <button class="btn ghost" onclick="share()">📤 Compartir</button>
    </div>
  </section>

  <section id="practico">
    <div class="head"><div class="k">Información práctica</div><h2>Antes de salir</h2></div>
    <div class="two">
      <div class="card"><div class="ic">🎒</div><h3>Qué llevar</h3><ul class="list" id="llevar"></ul></div>
      <div class="card red" id="aloj"></div>
    </div>
    <div id="map"></div>
  </section>
</div>

<footer>
  <img src="/logo-256.png" alt="">
  <div><b>Las Amistades Belgas de Levante</b> · Calpe</div>
  <div>A.S.B.L. · V.Z.W.</div>
</footer>

<script src="/madrid-2026.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const V = window.VIAJE;
const ICON = {encuentro:"📍",bus:"🚌",tren:"🚆",metro:"🚇",taxi:"🚕",visita:"🏛️",compras:"🛍️",comida:"🍽️",actividad:"✨",libre:"☕",hotel:"🛏️",vuelta:"🏠"};
const TAG  = {encuentro:"Salida",bus:"Autobús",tren:"Tren",metro:"Metro",taxi:"Taxi",visita:"Visita",compras:"Compras",comida:"Comida",actividad:"Actividad",libre:"Descanso",hotel:"Hotel",vuelta:"Regreso"};
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = s => { const d=D(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

document.title = `${V.titulo} · Amistades Belgas de Levante`;
if (V.ejemplo) document.getElementById("demo").hidden = false;
document.getElementById("titulo").textContent = V.titulo;
document.getElementById("subtitulo").textContent = V.subtitulo || "";
if (V.portada) document.getElementById("hero").insertAdjacentHTML("afterbegin",`<img class="bgimg" src="${esc(V.portada)}" alt="" onerror="this.remove()">`);

// pills + cuenta atrás
const ini = D(V.inicio), fin = D(V.fin), hoy = new Date(); hoy.setHours(0,0,0,0);
const nd = Math.round((fin-ini)/864e5)+1;
const d1 = D(V.inicio), d2 = D(V.fin);
const rango = d1.getMonth()===d2.getMonth()
  ? `${d1.getDate()} – ${d2.getDate()} de ${MESES[d1.getMonth()]}`
  : `${d1.getDate()} ${MESES[d1.getMonth()]} – ${d2.getDate()} ${MESES[d2.getMonth()]}`;
const faltan = Math.round((ini-hoy)/864e5);
let cuenta = "";
if (faltan > 1) cuenta = `Faltan ${faltan} días`;
else if (faltan === 1) cuenta = "¡Es mañana!";
else if (hoy <= fin) cuenta = "¡Estamos de viaje!";
document.getElementById("pills").innerHTML =
  `<span class="pill">📅 ${rango}</span><span class="pill">📍 ${esc(V.destino)}</span><span class="pill">${nd} ${nd===1?"día":"días"}</span>` +
  (cuenta ? `<span class="pill y">${cuenta}</span>` : "");

// tarjetas de info
const E = V.encuentro || {};
let info = `<div class="card red"><div class="ic">🚏</div><h3>Salida</h3><p><b>${esc(E.hora)}</b> · ${esc(E.lugar)}</p>${E.nota?`<p>${esc(E.nota)}</p>`:""}</div>`;
info += `<div class="card"><div class="ic">🏠</div><h3>Regreso</h3><p>${esc(V.regreso)}</p></div>`;
info += `<div class="card blk"><div class="ic">📞</div><h3>Organiza</h3><p>${esc(V.organiza)}</p>${V.contacto?`<p><b>${esc(V.contacto)}</b></p>`:""}${V.precio?`<p>Precio: <b>${esc(V.precio)}</b></p>`:""}</div>`;
document.getElementById("info").innerHTML = info;

// pestañas y días
const tabs = V.dias.map((d,i)=>`<button class="tab" data-i="${i}" onclick="go(${i})"><b>${cap(fmt(d.fecha).split(" ")[0])} ${D(d.fecha).getDate()}</b><span>${esc(d.titulo)}</span></button>`).join("");
document.getElementById("tabs").innerHTML = tabs + `<button class="tab all" data-i="all" onclick="go('all')"><b>Todo</b><span>Ver el programa entero</span></button>`;

document.getElementById("dias").innerHTML = V.dias.map((d,i)=>`
  <article class="day" id="dia${i}">
    <div class="day-head">
      <div>
        <div class="n">Día ${i+1} · ${fmt(d.fecha)}</div>
        <h3>${esc(d.titulo)}</h3>
        <p>${esc(d.resumen)}</p>
      </div>
      <div class="day-photo">${d.foto?`<img src="${esc(d.foto)}" alt="${esc(d.titulo)}" onerror="this.nextElementSibling.style.display='flex';this.remove()">`:""}<div class="ph" ${d.foto?'style="display:none"':''}><img src="/logo-256.png" alt=""></div></div>
    </div>
    <ol class="tl">${d.actividades.map((a,j)=>`
      <li class="act" data-d="${d.fecha}" data-h="${esc(a.hora)}" data-j="${j}">
        <div class="h">${a.hora?esc(a.hora):"·"}</div>
        <div class="dot"><i>${ICON[a.tipo]||"•"}</i></div>
        <div class="body"><span class="tag">${TAG[a.tipo]||"Plan"}</span><br><b>${esc(a.titulo)}</b>${a.detalle?`<p>${esc(a.detalle)}</p>`:""}</div>
      </li>`).join("")}
    </ol>
  </article>`).join("");

function go(i){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",String(t.dataset.i)===String(i)));
  document.querySelectorAll(".day").forEach((el,k)=>el.classList.toggle("on", i==="all" || k===i));
  try{ localStorage.setItem("calb-dia", String(i)); }catch(e){}
}
// abrir el día de hoy si estamos de viaje
const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-${String(hoy.getDate()).padStart(2,"0")}`;
const idxHoy = V.dias.findIndex(d=>d.fecha===hoyStr);
go(idxHoy >= 0 ? idxHoy : 0);

// marcar actividad actual durante el viaje
function marcarAhora(){
  const now = new Date(), nm = now.getHours()*60+now.getMinutes();
  const items = [...document.querySelectorAll(`.act[data-d="${hoyStr}"]`)];
  items.forEach(el=>el.classList.remove("now","past"));
  let cur = -1;
  items.forEach((el,k)=>{ const [h,m]=el.dataset.h.split(":").map(Number); if(!isNaN(h) && h*60+(m||0) <= nm) cur = k; });
  items.forEach((el,k)=>{ if(k<cur) el.classList.add("past"); if(k===cur) el.classList.add("now"); });
}
marcarAhora(); setInterval(marcarAhora, 60000);

// qué llevar y alojamiento
document.getElementById("llevar").innerHTML = (V.llevar||[]).map(x=>`<li>${esc(x)}</li>`).join("");
const A = V.alojamiento || {};
document.getElementById("aloj").innerHTML = `<div class="ic">🛏️</div><h3>Alojamiento</h3><p><b>${esc(A.nombre)}</b></p><p>${esc(A.zona)}</p><p>${esc(A.nota)}</p>`;
if (!A.nombre) document.getElementById("aloj").style.display = "none";

// mapa
try{
  if (!V.mapa || !V.mapa.length) throw 0;
  const map = L.map("map",{scrollWheelZoom:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
  const pin = n => L.divIcon({className:"",html:`<div style="background:#990000;color:#ffcc00;border:3px solid #ffcc00;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font:700 14px Inter">${n}</div>`,iconSize:[32,32],iconAnchor:[16,16]});
  V.mapa.forEach(([n,la,lo],i)=>L.marker([la,lo],{icon:pin(i+1)}).addTo(map).bindPopup(`<b>${esc(n)}</b>`));
  map.fitBounds(V.mapa.map(p=>[p[1],p[2]]),{padding:[40,40]});
}catch(e){ document.getElementById("map").style.display="none"; }

function share(){
  const data = {title:V.titulo, text:`${V.titulo} · ${rango}`, url:location.href};
  if (navigator.share) navigator.share(data).catch(()=>{});
  else { navigator.clipboard && navigator.clipboard.writeText(location.href); alertBox("Enlace copiado"); }
}
function alertBox(t){ const b=document.createElement("div"); b.textContent=t; b.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:10px 18px;border-radius:999px;z-index:99"; document.body.appendChild(b); setTimeout(()=>b.remove(),1800); }
</script>
</body>
</html>
